<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<link rel="stylesheet" href="tejass.css">
<body>
    <!--======= SKILL SECTION (GLASSMORPHISM) ===========-->
<section id="skills" class="section card">
    <h2 id="skill-titale">TECH-SKILLS</h2>
    <br>

    <div class="glass-skills-grid">
        
        <!-- C -->
        <div class="glass-skill-card" style="--glow-color: #00599C;">
            <img src="C_skill.png" alt="C Logo" class="skill-icon">
            <span class="skill-name">C</span>
        </div>
        
        <!-- C++ -->
        <div class="glass-skill-card" style="--glow-color: #00599C;">
            <img src="Cplusplus_skill.png" alt="C++ Logo" class="skill-icon">
            <span class="skill-name">C++</span>
        </div>

        <!-- Java -->
        <div class="glass-skill-card" style="--glow-color: #f89820;">
            <img src="Java_skill.png" alt="Java Logo" class="skill-icon">
            <span class="skill-name">Java</span>
        </div>

        <!-- HTML -->
        <div class="glass-skill-card" style="--glow-color: #E34F26;">
            <img src="HTML_skill.png" alt="HTML Logo" class="skill-icon">
            <span class="skill-name">HTML</span>
        </div>

        <!-- CSS -->
        <div class="glass-skill-card" style="--glow-color: #1572B6;">
            <img src="CSS_skill.png" alt="CSS Logo" class="skill-icon">
            <span class="skill-name">CSS</span>
        </div>

        <!-- SQL -->
        <div class="glass-skill-card" style="--glow-color: #00758F;">
            <img src="SQL_skill.png" alt="SQL Logo" class="skill-icon">
            <span class="skill-name">SQL</span>
        </div>

    </div>
</section>
    
</body>
</html>
